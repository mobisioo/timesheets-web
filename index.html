<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ثبت کار</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo">Work Tracker</div>
    <h1>ثبت <span>کار</span></h1>
  </div>

  <!-- ===== HOME DASHBOARD ===== -->
  <div class="step active" id="stepHome">
    <div class="dashboard">
      <div class="dash-card" id="dc-total">
        <div class="dash-icon">⏱</div>
        <div class="dash-value" id="dashTotal"><span class="spinner-sm"></span></div>
        <div class="dash-label">کل ساعات کاری</div>
      </div>
      <div class="dash-card" id="dc-month">
        <div class="dash-icon">📅</div>
        <div class="dash-value" id="dashMonth"><span class="spinner-sm"></span></div>
        <div class="dash-label">ساعت ماه جاری</div>
      </div>
      <div class="dash-card" id="dc-salary">
        <div class="dash-icon">💰</div>
        <div class="dash-value" id="dashSalary"><span class="spinner-sm"></span></div>
        <div class="dash-label">حقوق ماه جاری</div>
      </div>
    </div>
    <div id="dashError" class="error-msg" style="display:none;text-align:center;padding:8px 0"></div>
    <div class="quick-actions">
      <button class="btn btn-primary btn-big" onclick="startLog()">+ ثبت ساعت کاری</button>
      <button class="btn btn-ghost btn-action" onclick="openNewTaskModal()">+ ایجاد تسک جدید</button>
      <button class="btn btn-ghost btn-action" onclick="openSalaryModal()">💰 دستمزد و اضافه‌کاری</button>
      <button class="btn btn-ghost btn-action" onclick="window.location.href='report.html'">📅 گزارش کامل</button>
    </div>
  </div>

  <!-- ===== FORM STEPS ===== -->
  <div id="formFlow" style="display:none">
    <div class="progress">
      <div class="dot active" id="dot0"></div>
      <div class="dot" id="dot1"></div>
      <div class="dot" id="dot2"></div>
      <div class="dot" id="dot3"></div>
    </div>

    <!-- Step 0: Date -->
    <div class="step" id="step0">
      <div class="step-label">مرحله ۱ از ۳</div>
      <div class="step-title">چه روزیه؟</div>
      <div class="date-row">
        <div style="display:flex;flex-direction:column;gap:8px">
          <label>سال</label>
          <div class="year-badge" id="year"></div>
        </div>
        <div class="field">
          <label>ماه</label>
          <div class="select-wrap">
            <select id="month"></select>
          </div>
        </div>
        <div class="field">
          <label>روز</label>
          <div class="select-wrap">
            <select id="day"></select>
          </div>
        </div>
      </div>
      <button class="btn btn-primary" onclick="goToStep1()">ادامه</button>
      <button class="btn btn-ghost" onclick="backToHome()">برگشت</button>
    </div>

    <!-- Step 1: Task -->
    <div class="step" id="step1">
      <div class="step-label">مرحله ۲ از ۳</div>
      <div class="step-title">روی چی کار کردی؟</div>
      <div id="taskContainer">
        <div class="loading"><div class="spinner"></div> در حال بارگذاری...</div>
      </div>
      <button class="btn btn-primary" id="btnTask" onclick="goToStep2()" disabled>ادامه</button>
      <button class="btn btn-ghost" onclick="goToStep(0)">برگشت</button>
    </div>

    <!-- Step 2: Time + Description -->
    <div class="step" id="step2">
      <div class="step-label">مرحله ۳ از ۳</div>
      <div class="step-title">ساعت کار</div>

      <input type="hidden" id="startTimeVal">
      <input type="hidden" id="endTimeVal">

      <div class="time-picker-group">
        <div class="time-field">
          <label>شروع</label>
          <div class="time-selects" id="startTimePicker"></div>
        </div>
        <div class="time-field">
          <label>پایان</label>
          <div class="time-selects" id="endTimePicker"></div>
        </div>
      </div>

      <div class="field" style="margin-bottom:20px">
        <label>توضیحات (اختیاری)</label>
        <textarea id="description" placeholder="چی کار کردی..."></textarea>
      </div>
      <button class="btn btn-primary" id="btnSubmit" onclick="submitRecord()">ثبت کن</button>
      <button class="btn btn-ghost" onclick="goToStep(1)">برگشت</button>
    </div>

    <!-- Step 3: Success -->
    <div class="step" id="step3">
      <div class="success-box">
        <div class="success-icon">✓</div>
        <h2>ثبت شد!</h2>
        <p id="successMsg"></p>
        <div class="summary-pill" id="summaryPill"></div>
        <button class="btn btn-primary" onclick="resetForm()">ثبت روز دیگه</button>
        <button class="btn btn-ghost" onclick="backToHome()">بازگشت</button>
      </div>
    </div>
  </div><!-- /formFlow -->
</div>

<!-- New Task Modal -->
<div class="modal-backdrop" id="taskModal">
  <div class="modal">
    <h3>تسک جدید</h3>
    <input type="text" id="newTaskInput" placeholder="اسم پروژه یا تسک...">
    <div class="modal-actions">
      <button class="btn btn-primary" id="btnSaveTask" onclick="saveNewTask()">ذخیره</button>
      <button class="btn btn-ghost" onclick="closeModal()">انصراف</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="salaryModal">
  <div class="modal">
    <h3>تنظیم دستمزد و اضافه‌کاری</h3>
    <p class="muted-text">دستمزد فعلی: <strong id="salaryCurrentRate">۰</strong> تومان / ساعت</p>
    <label for="hourlyRateInput">دستمزد هر ساعت (تومان)</label>
    <input type="number" id="hourlyRateInput" min="0" step="1000" placeholder="150000">
    <label for="overtimeCoefInput">ضریب اضافه‌کاری</label>
    <input type="number" id="overtimeCoefInput" min="1" step="0.1" placeholder="1.5">
    <div class="modal-actions">
      <button class="btn btn-primary" id="btnSaveSalary" onclick="saveSalarySettings()">ذخیره</button>
      <button class="btn btn-ghost" onclick="closeSalaryModal()">انصراف</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/app.js"></script>
</body>
</html>
