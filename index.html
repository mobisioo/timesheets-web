<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ثبت کار</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- ===== AUTH GATE ===== -->
<div id="passwordGate" class="gate-overlay">
  <div class="gate-card">
    <div class="gate-logo">WT</div>
    <h2 class="gate-title">ثبت ساعت کار</h2>
    <p class="gate-sub">برای ادامه با حساب کاربری وارد شوید.</p>
    <div class="gate-login-grid">
      <div class="gate-fields">
        <input type="text" id="loginInput" placeholder="نام کاربری" autocomplete="username" style="direction:ltr;text-align:center">
        <input type="password" id="passwordInput" placeholder="رمز عبور" autocomplete="current-password">
      </div>
      <button class="gate-submit-btn" onclick="checkPassword()" id="gateBtn" type="button" aria-label="ورود">→</button>
      
    </div>
    <p class="gate-error" id="gateError"></p>
    <button class="btn btn-primary signup-entry-btn" type="button" onclick="openSignupModal()">ثبت‌نام</button>
  </div>
</div>

<!-- Signup Modal: خارج از appRoot است تا قبل از ورود هم باز شود -->
<div class="modal-backdrop" id="signupModal" style="z-index:1100">
  <div class="modal">
    <h3>ثبت‌نام کاربر جدید</h3>
    <label for="signupUsername">نام کاربری</label>
    <input type="text" id="signupUsername" placeholder="نام کاربری" autocomplete="username" style="direction:ltr;text-align:center">
    <label for="signupFullName">نام نمایشی</label>
    <input type="text" id="signupFullName" placeholder="نام و نام خانوادگی">
    <label for="signupPassword">رمز عبور</label>
    <input type="password" id="signupPassword" placeholder="رمز عبور" autocomplete="new-password">
    <label for="signupPassword2">تکرار رمز عبور</label>
    <input type="password" id="signupPassword2" placeholder="تکرار رمز عبور" autocomplete="new-password">
    <p class="gate-error" id="signupError"></p>
    <div class="modal-actions">
      <button class="btn btn-primary" id="btnSignup" type="button" onclick="registerUser()">ثبت‌نام</button>
      <button class="btn btn-ghost" type="button" onclick="closeSignupModal()">لغو</button>
    </div>
  </div>
</div>

<div id="appRoot" style="display:none">
<div class="container">
  <div class="header">
    <div class="logo">WT</div>
    <h1>ساعت <span>کار</span></h1>
    <p class="muted-text" id="currentUserBadge" style="margin-top:-8px"></p>
  </div>

  <!-- ===== HOME DASHBOARD ===== -->
  <div class="step active" id="stepHome">
    <div class="dashboard">
      <div class="dash-card">
        <div class="dash-label">کل ساعت کار</div>
        <div class="dash-value" id="dashTotal"><span class="spinner-sm"></span></div>
      </div>
      <div class="dash-card">
        <div class="dash-label">ماه جاری</div>
        <div class="dash-value" id="dashMonth"><span class="spinner-sm"></span></div>
      </div>
      <div class="dash-card accent-card">
        <div class="dash-label">دستمزد</div>
        <div class="dash-value" id="dashSalary"> <span class="spinner-sm"></span></div>
      </div>
    </div>
    <div id="dashError" class="error-msg" style="display:none;text-align:center;padding:8px 0"></div>
    <div class="quick-actions">
      <button class="btn btn-primary btn-big" onclick="startLog()">+ ثبت ساعت کاری</button>
      <div class="action-row">
        <button class="btn btn-ghost btn-action" onclick="openTaskManagerModal()">تسک ها</button>
        <button class="btn btn-ghost btn-action" onclick="openSalaryModal()">دستمزد</button>
        <button class="btn btn-ghost btn-action" onclick="window.location.href='report.html'">گزارش</button>
      </div>
      <button class="btn btn-ghost" id="adminNavBtn" style="display:none" onclick="window.location.href='admin.html'">پنل ادمین</button>
      <button class="btn btn-ghost" onclick="logout()">خروج</button>
    </div>
  </div>

  <!-- ===== FORM STEPS ===== -->
  <div id="formFlow" style="display:none">
    <div class="progress">
      <div class="prog-step active" id="dot0"><span>1</span></div>
      <div class="prog-line"></div>
      <div class="prog-step" id="dot1"><span>2</span></div>
      <div class="prog-line"></div>
      <div class="prog-step" id="dot2"><span>3</span></div>
    </div>

    <!-- Step 0: Date -->
    <div class="step" id="step0">
      <div class="step-label">1 از 3</div>
      <div class="step-title">چه روزی؟</div>
      <div class="date-row">
        <div style="display:flex;flex-direction:column;gap:8px">
          <label>سال</label>
          <div class="year-badge" id="year"></div>
        </div>
        <div class="field">
          <label>ماه</label>
          <div class="select-wrap">
            <select id="month"></select>
          </div>
        </div>
        <div class="field">
          <label>روز</label>
          <div class="select-wrap">
            <select id="day"></select>
          </div>
        </div>
      </div>
      <button class="btn btn-primary" onclick="goToStep1()">ادامه</button>
      <button class="btn btn-ghost" onclick="backToHome()">برگشت</button>
    </div>

    <!-- Step 1: Task -->
    <div class="step" id="step1">
      <div class="step-label">2 از 3</div>
      <div class="step-title">چه کاری انجام دادی؟</div>
      <div id="taskContainer">
        <div class="loading"><div class="spinner"></div> Loading...</div>
      </div>
      <button class="btn btn-primary" id="btnTask" onclick="goToStep2()" disabled>ادامه</button>
      <button class="btn btn-ghost" onclick="goToStep(0)">برگشت</button>
    </div>

    <!-- Step 2: Time + Description -->
    <div class="step" id="step2">
      <div class="step-label">3 از 3</div>
      <div class="step-title">ساعت کاری</div>

      <input type="hidden" id="startTimeVal">
      <input type="hidden" id="endTimeVal">

      <div class="time-picker-group">
        <div class="time-field">
          <label>شروع</label>
          <div class="time-selects" id="startTimePicker"></div>
        </div>
        <div class="time-field">
          <label>پایان</label>
          <div class="time-selects" id="endTimePicker"></div>
        </div>
      </div>

      <div class="field" style="margin-bottom:20px">
        <label>توضیحات (اختیاری)</label>
        <textarea id="description" placeholder="چه کاری انجام دادی..."></textarea>
      </div>
      <button class="btn btn-primary" id="btnSubmit" onclick="submitRecord()">ثبت</button>
      <button class="btn btn-ghost" onclick="goToStep(1)">برگشت</button>
    </div>

    <!-- Step 3: Success -->
    <div class="step" id="step3">
      <div class="success-box">
        <div class="success-icon">✓</div>
        <h2>ثبت شد!</h2>
        <p id="successMsg"></p>
        <div class="summary-pill" id="summaryPill"></div>
        <button class="btn btn-primary" onclick="resetForm()">ثبت روز دیگر</button>
        <button class="btn btn-ghost" onclick="backToHome()">صفحه اصلی</button>
      </div>
    </div>
  </div>
</div>

<!-- Task Modal -->
<div class="modal-backdrop" id="taskModal">
  <div class="modal">
    <h3 id="taskModalTitle">مدیریت وظایف</h3>
    <div id="taskManagerList" class="task-manager-list"></div>
    <input type="text" id="newTaskInput" placeholder="نام پروژه یا وظیفه...">
    <div class="modal-actions">
      <button class="btn btn-primary" id="btnSaveTask" onclick="saveNewTask()">افزودن وظیفه</button>
      <button class="btn btn-ghost" onclick="closeModal()">لغو</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="confirmModal">
  <div class="modal confirm-modal">
    <h3>تأیید حذف</h3>
    <p id="confirmText" class="muted-text">آیا مطمئن هستید؟</p>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="confirmYes()">تأیید</button>
      <button class="btn btn-ghost" onclick="confirmNo()">لغو</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="salaryModal">
  <div class="modal">
    <h3>تنظیمات دستمزد</h3>
    <p class="muted-text">نرخ فعلی: <strong id="salaryCurrentRate">0</strong> تومان/ساعت</p>
    <label for="hourlyRateInput">نرخ ساعتی (تومان)</label>
    <input type="number" id="hourlyRateInput" min="0" step="1000" placeholder="150000">
    <label for="overtimeCoefInput">ضریب اضافه کار</label>
    <input type="number" id="overtimeCoefInput" min="1" step="0.1" placeholder="1.5">
    <div class="modal-actions">
      <button class="btn btn-primary" id="btnSaveSalary" onclick="saveSalarySettings()">ثبت</button>
      <button class="btn btn-ghost" onclick="closeSalaryModal()">لغو</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
</div><!-- /appRoot -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/app.js"></script>
</body>
</html>
