<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>گزارش کامل</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="container report-page">
    <div class="header">
      <div class="logo">Work Tracker</div>
      <h1>گزارش <span>کامل</span></h1>
    </div>

    <section class="report-card">
      <div class="report-header">
        <div>
          <div class="report-eyebrow">گزارش گیری</div>
          <h2 class="report-title">فیلتر و مشاهده‌ی کارهای ثبت شده</h2>
        </div>
        <div class="report-actions">
          <button class="btn btn-ghost btn-small" onclick="window.location.href='index.html'">بازگشت</button>
          <button class="btn btn-primary btn-small" id="exportExcelBtn" onclick="exportReportToExcel()">خروجی اکسل</button>
        </div>
      </div>

      <div class="filter-grid">
        <div class="field">
          <label for="taskFilter">تسک</label>
          <div class="select-wrap">
            <select id="taskFilter"></select>
          </div>
        </div>
        <div class="field">
          <label for="yearFilter">سال</label>
          <div class="select-wrap">
            <select id="yearFilter"></select>
          </div>
        </div>
        <div class="field">
          <label for="monthFilter">ماه</label>
          <div class="select-wrap">
            <select id="monthFilter"></select>
          </div>
        </div>
        <div class="field">
          <label for="dayFilter">روز</label>
          <div class="select-wrap">
            <select id="dayFilter"></select>
          </div>
        </div>
      </div>

      <div id="reportSummary" class="report-summary"></div>

      <div class="table-wrap">
        <table class="report-table">
          <thead>
            <tr>
              <th>تاریخ</th>
              <th>تسک</th>
              <th>ساعت</th>
              <th>شروع</th>
              <th>پایان</th>
              <th>توضیحات</th>
              <th>عملیات</th>
            </tr>
          </thead>
          <tbody id="reportBody">
            <tr><td colspan="6" class="loading">در حال بارگذاری گزارش...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="confirmModal">
    <div class="modal confirm-modal">
      <h3>تأیید حذف</h3>
      <p id="confirmText" class="muted-text">آیا مطمئن هستید؟</p>
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="confirmYes()">بله، حذف کن</button>
        <button class="btn btn-ghost" onclick="confirmNo()">خیر</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="recordModal">
    <div class="modal">
      <h3>اصلاح رکورد ساعت کاری</h3>
      <label for="recordDateInput">تاریخ (سال-ماه-روز)</label>
      <input type="text" id="recordDateInput" placeholder="1405-01-01">
      <label for="recordTaskSelect">تسک</label>
      <div class="select-wrap">
        <select id="recordTaskSelect"></select>
      </div>
      <label for="recordStartInput">شروع</label>
      <input type="time" id="recordStartInput">
      <label for="recordEndInput">پایان</label>
      <input type="time" id="recordEndInput">
      <label for="recordDescInput">توضیحات</label>
      <textarea id="recordDescInput" placeholder="توضیح کوتاه..."></textarea>
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="saveRecordEdit()">ذخیره تغییرات</button>
        <button class="btn btn-ghost" onclick="closeRecordModal()">انصراف</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="assets/app.js"></script>
</body>
</html>
