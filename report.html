<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>گزارش — ساعت کار</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="page-report">
  <div class="container report-page">
    <div class="header">
      <div class="logo">WT</div>
      <h1>Work <span>گزارش ساعات کار</span></h1>
      <p class="muted-text" style="margin-top:-8px">این صفحه عمومی است؛ نیازی به ورود ندارد.</p>
    </div>
    <section class="report-card">
      <div class="report-header">
        <div>
          <div class="report-eyebrow">آنالیز</div>
          <h2 class="report-title">ساعات کاری ثبت‌شده</h2>
        </div>
        <div class="report-actions">
          <button class="btn btn-ghost btn-small" onclick="navigateTo('index.html')">ثبت ساعت کار</button>
          <button class="btn btn-primary btn-small" onclick="exportReportToExcel()">خروجی CSV</button>
          <button class="btn btn-primary btn-small" onclick="exportOdooReport()">خروجی Odoo</button>
        </div>
      </div>
      <div class="filter-grid">
        <div class="field" id="userFilterWrap">
          <label for="userFilter">کاربر</label>
          <div class="select-wrap"><select id="userFilter"></select></div>
        </div>
        <div class="field">
          <label for="taskFilter">تسک</label>
          <div class="select-wrap"><select id="taskFilter"></select></div>
        </div>
        <div class="field">
          <label for="yearFilter">سال</label>
          <div class="select-wrap"><select id="yearFilter"></select></div>
        </div>
        <div class="field">
          <label for="monthFilter">ماه</label>
          <div class="select-wrap"><select id="monthFilter"></select></div>
        </div>
        <div class="field">
          <label for="dayFilter">روز</label>
          <div class="select-wrap"><select id="dayFilter"></select></div>
        </div>
      </div>
      <div id="reportSummary" class="report-summary"></div>
      <div class="table-wrap">
        <table class="report-table report-table--readonly">
          <thead>
            <tr>
              <th>کاربر</th><th>تاریخ</th><th>تسک</th><th>مجموع ساعت کاری</th><th>شروع</th><th>پایان</th><th>یادداشت‌ها</th>
            </tr>
          </thead>
          <tbody id="reportBody">
            <tr><td colspan="7" class="loading">در حال بارگذاری...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
