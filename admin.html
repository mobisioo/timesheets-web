<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل ادمین — ساعت کار</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="page-admin">
  <div id="passwordGate" class="gate-overlay">
    <div class="gate-card">
      <div class="gate-logo">WT</div>
      <h2 class="gate-title">پنل ادمین</h2>
      <p class="gate-sub">برای مدیریت کاربران وارد شوید.</p>
      <div class="gate-login-grid">
        <div class="gate-fields">
          <label class="floating-field" for="loginInput">
            <input type="text" id="loginInput" placeholder=" " autocomplete="username" style="text-align: center;">
            <span>نام کاربری</span>
          </label>
          <label class="floating-field" for="passwordInput">
            <input type="password" id="passwordInput" placeholder=" " autocomplete="current-password" style="text-align: center;">
            <span>رمز عبور</span>
          </label>
        </div>
        <button class="gate-submit-btn" onclick="checkPassword()" id="gateBtn" type="button">ورود</button>
      </div>
      <p class="gate-error" id="gateError"></p>
    </div>
  </div>

  <div id="appRoot" style="display:none">
  <div class="container report-page">
    <div class="header">
      <div class="logo">WT</div>
      <h1>Admin <span>مدیریت کاربران</span></h1>
      <p class="muted-text" id="currentUserBadge" style="margin-top:-8px"></p>
    </div>

    <section class="report-card" style="margin-bottom:16px">
      <div class="report-header">
        <div>
          <div class="report-eyebrow">کاربر جدید</div>
          <h2 class="report-title">افزودن یوزر</h2>
        </div>
        <div class="report-actions">
          <button class="btn btn-ghost btn-small" onclick="navigateTo('index.html')">ثبت کار</button>
          <button class="btn btn-ghost btn-small" onclick="navigateTo('report.html')">گزارش</button>
          <button class="btn btn-ghost btn-small" onclick="logout()">خروج</button>
        </div>
      </div>
      <div class="filter-grid">
        <div class="field">
          <label for="newUserUsername">نام کاربری</label>
          <input type="text" id="newUserUsername" placeholder="نام کاربری">
        </div>
        <div class="field">
          <label for="newUserFullName">نام نمایشی</label>
          <input type="text" id="newUserFullName" placeholder="نام و نام خانوادگی">
        </div>
        <div class="field">
          <label for="newUserPassword">رمز عبور</label>
          <input type="password" id="newUserPassword" placeholder="رمز عبور" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="newUserRole">نقش</label>
          <div class="select-wrap">
            <select id="newUserRole">
              <option value="user">کاربر</option>
              <option value="admin">ادمین</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="newUserTelegram">یوزرنیم تلگرام</label>
          <input type="text" id="newUserTelegram" placeholder="بدون @">
        </div>
        <div class="field">
          <label for="newUserHourlyRate">نرخ ساعتی</label>
          <input type="number" id="newUserHourlyRate" min="0" step="1000" value="150000">
        </div>
        <div class="field">
          <label for="newUserOvertimeCoef">ضریب اضافه‌کاری</label>
          <input type="number" id="newUserOvertimeCoef" min="1" step="0.1" value="1.5">
        </div>
      </div>
      <button class="btn btn-primary" onclick="createAdminUser()">افزودن کاربر</button>
    </section>

    <section class="report-card">
      <div class="report-header">
        <div>
          <div class="report-eyebrow">لیست</div>
          <h2 class="report-title">کاربران سیستم</h2>
        </div>
        <div class="report-actions">
          <button class="btn btn-ghost btn-small" onclick="loadAdminUsers()">به‌روزرسانی</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="report-table">
          <thead>
            <tr>
              <th>نام نمایشی</th><th>نام کاربری</th><th>نقش</th><th>وضعیت</th><th>نرخ</th><th>ضریب</th><th>تلگرام</th><th>اقدامات</th>
            </tr>
          </thead>
          <tbody id="adminUsersBody">
            <tr><td colspan="8" class="loading">در حال بارگذاری...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="confirmModal">
    <div class="modal confirm-modal">
      <h3>تأیید عملیات</h3>
      <p id="confirmText" class="muted-text">آیا مطمئن هستید؟</p>
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="confirmYes()">تأیید</button>
        <button class="btn btn-ghost" onclick="confirmNo()">لغو</button>
      </div>
    </div>
  </div>
  <div class="modal-backdrop" id="adminEditUserModal">
    <div class="modal">
      <h3>ویرایش کاربر</h3>
      <label for="adminEditFullName">نام نمایشی</label>
      <input type="text" id="adminEditFullName" placeholder="نام و نام خانوادگی">
      <label for="adminEditUsername">نام کاربری</label>
      <input type="text" id="adminEditUsername" placeholder="نام کاربری">
      <label for="adminEditRole">نقش</label>
      <div class="select-wrap">
        <select id="adminEditRole">
          <option value="user">کاربر</option>
          <option value="admin">ادمین</option>
        </select>
      </div>
      <label for="adminEditTelegram">یوزرنیم تلگرام</label>
      <input type="text" id="adminEditTelegram" placeholder="بدون @">
      <label for="adminEditHourlyRate">نرخ ساعتی</label>
      <input type="number" id="adminEditHourlyRate" min="0" step="1000">
      <label for="adminEditOvertimeCoef">ضریب اضافه‌کاری</label>
      <input type="number" id="adminEditOvertimeCoef" min="1" step="0.1">
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="saveAdminUserEdit()">ذخیره تغییرات</button>
        <button class="btn btn-ghost" onclick="closeAdminEditUserModal()">لغو</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="adminPasswordModal">
    <div class="modal">
      <h3>تغییر رمز عبور</h3>
      <p class="muted-text">کاربر: <strong id="adminPasswordUserName">—</strong></p>
      <label for="adminPasswordInput">رمز عبور جدید</label>
      <input type="password" id="adminPasswordInput" placeholder="رمز جدید" autocomplete="new-password">
      <label for="adminPasswordRepeatInput">تکرار رمز عبور</label>
      <input type="password" id="adminPasswordRepeatInput" placeholder="تکرار رمز جدید" autocomplete="new-password">
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="saveAdminPassword()">ذخیره رمز</button>
        <button class="btn btn-ghost" onclick="closeAdminPasswordModal()">لغو</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  </div><!-- /appRoot -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/app.js"></script>
</body>
</html>
